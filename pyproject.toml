[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "academic-ppt-system-v1"
version = "1.0.0"
description = "Evidence-grounded academic presentation planning, composition, QA, scoring, and freezing."
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23",
  "numpy>=2.0",
  "Pillow>=10.4",
  "PyYAML>=6.0",
]

[project.scripts]
academic-ppt = "academic_ppt.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
